<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Design Your Pookalam</title>
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>

    <header class="app-header" style="position: sticky; background: var(--cream);">
        <button class="icon-btn" id="btnBack" aria-label="Back" hidden>←</button>
        <span class="title" id="pageTitle">Design Your Pookalam</span>
        <button class="icon-btn" aria-label="Profile">👤</button>
    </header>

    <main class="page" id="pageContent">

        <!-- ===== STEP 1: TEMPLATE SELECTION ===== -->
        <section id="templateStep">
            <h1>Design Your Pookalam</h1>
            <p class="subtitle">How would you like to start?</p>

            <div class="template-grid">
                <button class="template-card" id="btnChooseTemplate">
                    <span class="template-icon">🌸</span>
                    <span class="template-name">Choose a Template</span>
                    <span class="template-desc">Pick from our ready-made pookalam designs</span>
                </button>

                <button class="template-card" id="btnUploadOwn">
                    <span class="template-icon">📷</span>
                    <span class="template-name">Upload Your Own</span>
                    <span class="template-desc">Use your own image as a tracing guide</span>
                </button>
            </div>
        </section>

        <!-- ===== STEP 1.5: SUB-TEMPLATE SELECTION ===== -->
        <section id="subTemplateStep" hidden style="width:100%;">
            <h1 id="subTemplateTitle">Pick a design</h1>
            <p class="subtitle" id="subTemplateSubtitle">Select a layout to use as your guide.</p>
            
            <div id="predefinedTemplates" class="template-grid" hidden>
                <!-- Populated dynamically by JS -->
            </div>

            <div id="customTemplateUpload" style="text-align: center; padding: 40px; border: 2px dashed var(--gold); border-radius: 12px; margin-top: 20px;" hidden>
                <p style="margin-bottom: 16px;">Upload a picture to use as a tracing guide.</p>
                <input type="file" id="templateFileInput" accept="image/*" hidden />
                <button class="hero-btn-solid" onclick="document.getElementById('templateFileInput').click()">Browse Files</button>
            </div>
        </section>

        <!-- ===== STEP 2: THE CANVAS ===== -->
        <section id="canvasStep" hidden>

            <div class="palette-row" id="colorPalette" role="group" aria-label="Petal colours"></div>

            <div class="size-row" role="group" aria-label="Petal size">
                <button class="size-btn" data-size="small">Small</button>
                <button class="size-btn active" data-size="medium">Medium</button>
                <button class="size-btn" data-size="large">Large</button>
            </div>

            <div class="canvas-shell">
                <svg id="pookalamCanvas" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <radialGradient id="floorGradient" cx="50%" cy="45%" r="70%">
                            <stop offset="0%" stop-color="#fffaf0" />
                            <stop offset="100%" stop-color="#f3e6c8" />
                        </radialGradient>
                    </defs>
                    <rect width="400" height="400" fill="url(#floorGradient)" />
                    <g id="guideLayer"></g>
                    <g id="petalLayer"></g>
                </svg>
                <p class="canvas-hint" id="canvasHint">Tap inside the circle to place a flower.</p>
            </div>

            <div class="canvas-actions">
                <button class="ghost-btn" id="btnUndo">Undo</button>
                <button class="ghost-btn" id="btnClear">Clear</button>
                <button class="hero-btn-solid" id="btnDownload">Download</button>
            </div>
        </section>

    </main>



    <script src="js/main.js"></script>
    <script src="js/design.js"></script>
</body>

</html>
